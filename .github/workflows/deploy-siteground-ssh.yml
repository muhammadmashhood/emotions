name: Deploy to SiteGround (SSH)

# Builds the app in GitHub (composer --no-dev, npm build), uploads it to SiteGround as a tar stream over SSH and runs post-deploy.sh there
# (migrations, caches, storage link, queue restart). Runs on every push to master, or by hand from the Actions tab.
# Required repository secrets: SG_SSH_HOST, SG_SSH_PORT (18765), SG_SSH_USER, SG_SSH_KEY (private key), SG_APP_DIR (absolute path).
# Optional: SG_PHP (PHP binary on the server, default "php").

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-siteground
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, intl, zip, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Build front-end assets
        run: npm ci && npm run build

      - name: Prepare the bundle
        run: |
          rm -rf node_modules tests docs/screenshots docker Dockerfile docker-compose.yml release deploy/build-release.sh
          cp deploy/siteground/root.htaccess root.htaccess
          cp deploy/siteground/post-deploy.sh post-deploy.sh
          cp deploy/siteground/cron.txt cron.txt
          chmod +x post-deploy.sh

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SG_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SG_SSH_PORT }}" -H "${{ secrets.SG_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Check the remote shell
        run: |
          echo "Remote login output (should be empty; banners break some tools):"
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SG_SSH_PORT }}" "${{ secrets.SG_SSH_USER }}@${{ secrets.SG_SSH_HOST }}" "true" | sed 's/^/  > /'
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SG_SSH_PORT }}" "${{ secrets.SG_SSH_USER }}@${{ secrets.SG_SSH_HOST }}" "test -d '${{ secrets.SG_APP_DIR }}' && echo 'app dir OK' || (echo 'app dir missing: ${{ secrets.SG_APP_DIR }}' && exit 1)"

      - name: Build the release archive
        run: |
          tar czf /tmp/release.tgz \
            --exclude='./.git' --exclude='./.github' \
            --exclude='./.env' --exclude='./.env.*' \
            --exclude='./storage' --exclude='./bootstrap/cache/*.php' \
            --exclude='./.htaccess' --exclude='./public/storage' \
            --exclude='./phpunit.xml' --exclude='./phpstan.neon' \
            --exclude='./package.json' --exclude='./package-lock.json' \
            --exclude='./vite.config.js' --exclude='./tailwind.config.js' --exclude='./postcss.config.js' \
            --exclude='./resources/js' --exclude='./resources/css' \
            .
          ls -lh /tmp/release.tgz

      - name: Upload the archive (SFTP) and extract it on the server
        # The archive is copied with scp's SFTP mode (immune to login banners), then unpacked in place.
        # .env, storage/, the root .htaccess and public/storage are not in the archive; vendor/ and public/build/
        # are replaced wholesale so stale files from earlier releases cannot linger.
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${{ secrets.SG_SSH_PORT }} ${{ secrets.SG_SSH_USER }}@${{ secrets.SG_SSH_HOST }}"
          APP='${{ secrets.SG_APP_DIR }}'
          echo "::group::Remote environment"
          $SSH "cd '$APP' && pwd && (tar --version | head -1) && df -h . | tail -1 && ls -la | head -20"
          echo "::endgroup::"
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SG_SSH_PORT }} /tmp/release.tgz "${{ secrets.SG_SSH_USER }}@${{ secrets.SG_SSH_HOST }}:$APP/release.tgz"
          $SSH "cd '$APP' && ls -lh release.tgz && rm -rf vendor public/build && tar xzf release.tgz && rm -f release.tgz && ls -la | head -40 && echo 'extracted OK'"

      - name: Prepare server state (storage folders, .env check)
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p ${{ secrets.SG_SSH_PORT }} ${{ secrets.SG_SSH_USER }}@${{ secrets.SG_SSH_HOST }}"
          APP='${{ secrets.SG_APP_DIR }}'
          $SSH "cd '$APP' && mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache && chmod -R u+rwX storage bootstrap/cache && echo 'storage OK'"
          # Web-root guard for the all-in-public_html layout: installed only when absent, never overwritten.
          # Installed when absent; refreshed when the existing file is still our stock guard (custom edits are kept).
          $SSH "cd '$APP' && if [ ! -f .htaccess ] || grep -q 'Option B: the whole app lives inside public_html' .htaccess; then cp root.htaccess .htaccess && echo 'root .htaccess installed/refreshed'; else echo 'custom .htaccess present (kept)'; fi"
          if ! $SSH "test -f '$APP/.env'"; then
            echo "::error title=.env missing::No .env in $APP. Copy .env.siteground.example to .env on the server, fill in APP_URL, DB_* and MAIL_*, run 'php artisan key:generate --force' (or reuse the old APP_KEY), then re-run this workflow."
            exit 1
          fi
          $SSH "cd '$APP' && grep -E '^(APP_URL|DB_DATABASE|QUEUE_CONNECTION)=' .env | sed 's/=.*/=…/' "

      - name: Run post-deploy on the server
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SG_SSH_PORT }}" "${{ secrets.SG_SSH_USER }}@${{ secrets.SG_SSH_HOST }}" \
            "cd '${{ secrets.SG_APP_DIR }}' && PHP='${{ secrets.SG_PHP || 'php' }}' ./post-deploy.sh"
