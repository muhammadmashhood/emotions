services:
  app:
    build:
      context: .
      target: app
    env_file: .env
    volumes:
      - ./:/var/www/html
      - app-vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  worker:
    build:
      context: .
      target: app
    env_file: .env
    command: php artisan queue:work redis --queue=webhooks,default --sleep=1 --tries=3 --backoff=10,60,300 --max-time=3600
    volumes:
      - ./:/var/www/html
      - app-vendor:/var/www/html/vendor
    depends_on:
      - app

  scheduler:
    build:
      context: .
      target: app
    env_file: .env
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
      - app-vendor:/var/www/html/vendor
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-emotion}
      MYSQL_USER: ${DB_USERNAME:-emotion}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_PORT:-8025}:8025"
      - "1025:1025"

volumes:
  mysql-data:
  redis-data:
  app-vendor:
